<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoMoM - MoMs & Sharing</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --surface: #ffffff;
        --border: #d8e2ef;
        --primary: #3b82f6;
        --primary-dark: #1d4ed8;
        --text: #102a43;
        --muted: #627d98;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        font-family: 'Inter', 'Segoe UI', -apple-system, system-ui, sans-serif;
        background: linear-gradient(135deg, #edf2ff 0%, #f8fafc 99%);
        color: var(--text);
        margin: 0;
      }
      .site-wrap { max-width: 860px; margin: 30px auto; padding: 0 16px; }
      header {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 16px 20px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h1 { margin: 0; font-size: 1.6rem; }
      nav a {
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        margin-left: 14px;
        padding: 8px 12px;
        border-radius: 8px;
      }
      nav a:hover { background: #edf2ff; color: var(--primary-dark); }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        box-shadow: var(--shadow);
      }
      .mom-list { list-style:none; padding:0; }
      .mom-list li { padding:12px 0; border-bottom:1px solid #e2e8f0; }
      .mom-list li:last-child { border-bottom:none; }
      .mom-list a { color: var(--primary); }
      .mom-list a:hover { text-decoration: underline; }
      .small-link { margin-left: 10px; color: #4b5563; font-size: 0.95rem; }
      .highlight { background-color: #fef3c7; border-left: 4px solid var(--primary); padding-left: 12px; }
      .share-form { margin-top: 12px; display: none; }
      .share-form.active { display: block; }
      .form-field { margin-bottom: 16px; }
      label { display:block; font-weight: 600; margin-bottom: 8px; color: var(--muted); }
      textarea {
        width:100%;
        border:1px solid #cbd5e1;
        border-radius:8px;
        padding:10px;
        font-size:0.98rem;
        background:#fff;
        min-height: 60px;
        resize: vertical;
      }
      button {
        background-color: var(--primary);
        color:white;
        border:none;
        border-radius:8px;
        padding: 8px 16px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor:pointer;
        transition: all 0.18s ease;
      }
      button:hover { background-color: var(--primary-dark); }
      .message { margin-top: 12px; padding: 10px; border-radius: 8px; }
      .message.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
      .message.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    </style>
  </head>
  <body>
    <div class="site-wrap">
    <header>
      <h1>MoMs & Sharing</h1>
      <nav>
        <a href="/">Upload</a>
      </nav>
    </header>

    <div class="card">
      {% if mom_files %}
        <ul class="mom-list">
          {% for mom in mom_files %}
            <li class="{% if highlight and mom == highlight %}highlight{% endif %}">
              <div>
                <strong><a href="{{ url_for('upload.show_mom', filename=mom) }}">{{ mom }}</a></strong>
                <span style="margin-left: 10px;"><a href="{{ url_for('upload.download_mom', filename=mom) }}">Download</a></span>
                <button onclick="toggleShare('{{ mom }}')" style="margin-left: 10px; background: none; border: none; color: var(--primary); text-decoration: underline; cursor: pointer; font-size: 0.95rem;">Share</button>
              </div>
              <div id="share-{{ mom }}" class="share-form">
                <form method="POST" style="margin-top: 8px;">
                  <input type="hidden" name="filename" value="{{ mom }}">
                  <div class="form-field">
                    <label>Email Addresses (comma-separated)</label>
                    <textarea name="emails" placeholder="email1@example.com, email2@example.com"></textarea>
                  </div>
                  <button type="submit">Send MoM</button>
                </form>
              </div>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p>No MoM files found yet. Upload an audio to generate one.</p>
      {% endif %}

      {% if error %}
        <div class="message error">{{ error }}</div>
      {% endif %}
      {% if success %}
        <div class="message success">{{ success }}</div>
      {% endif %}
    </div>
    </div>

    <script>
      function toggleShare(filename) {
        const form = document.getElementById('share-' + filename);
        if (form.classList.contains('active')) {
          form.classList.remove('active');
        } else {
          // Close other open forms
          document.querySelectorAll('.share-form.active').forEach(f => f.classList.remove('active'));
          form.classList.add('active');
        }
      }
    </script>
  </body>
</html>
